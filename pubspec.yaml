name: fitness_tracker
description: A fitness workout tracker with progress charts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/fitness_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/fitness_logo.png"
  adaptive_icon_background: "#FFFFFF"
