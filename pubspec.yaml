name: fitness_tracker
description: A fitness workout tracker with progress charts
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
 fitness_logo: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/fitness_logo.png


fitness_logo:
  android: true
  ios: false
  image_path: "fitness_logo"
  min_sdk_android: 21
